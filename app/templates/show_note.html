{% extends "page.html" %}

{%block show_note%}
<section class="show-note">
    <div class="level pb-0 mb-0">
        <div class="level-left">
            <button class="button level-item is-warning" data-lastpage={%if folder_id
                !=0%} "{{url_for('show_folder' , sub_id = selected , folder_id = folder_id)}}" {% else
                %} "{{url_for('show_sub' , sub_id = selected)}}" {% endif %} onclick="back_page(this)">last
                page</button>
        </div>
    </div>
    <div class="columns">
        <div class="column is-8 is-offset-2">
            <!-- <p class="content" style="white-space: pre-wrap;overflow-y: scroll;height : 80vh;">
                {{text}}
            </p> -->
            <button type="button" id="edit-note-btn" class="button is-warning is-small is-light mb-2"
                onclick="edit_note()">Edit</button>
            <button type="button" id="ltr-note-btn" class="button is-warning is-small is-light mr-1 mb-2"
                onclick="ltr()" style="display: none;">LTR</button>
            <button type="button" id="rtl-note-btn" class="button is-warning is-small is-light mr-1 mb-2"
                onclick="rtl()">RTL</button>
            <form action="{{url_for('edit_note' , sub_id = selected , folder_id=folder_id , note_id = note_id)}}"
                method="post">
                <div class="buttons m-0 p-0" id="show-btns" style="display: none;">
                    <button type="submit" class="button is-primary is-small is-light">Save</button>
                    <a href="" class="button is-warning is-small is-light">Back</a>
                </div>
                <textarea id="show-note-textarea" name="text" class="textarea" readonly
                    style="height: 80vh; cursor: default; resize: none; text-align: left;" ondblclick="edit_note()"
                    dir="ltr">{{text}}</textarea>
            </form>

        </div>
    </div>

</section>
{%endblock show_note%}
